# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json
# For more information, visit https://github.com/amnweb/yasb/wiki

watch_stylesheet: true
watch_config: true
system_colors: false
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    style: "bar"
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 48
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - home
      center:
      - clock
      - media_art
      - media
      - audio_visualizer
      - media_controls
      - notifications

widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span>家</span>"
      system_menu: false
      power_menu: true
      blur: false
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -5

  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%H:%M}'
      label_alt: '{%a, %d %b %H:%M}'
      timezones: []
      calendar:
        blur: false
        round_corners: true
        alignment: center
        direction: down
        offset_left: 0
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_right: toggle_label

  # Separate thumbnail: MediaWidget normally overlays its artwork and text.
  media_art:
    type: yasb.media.MediaWidget
    options:
      label: " "
      label_alt: " "
      class_name: "cover-art"
      hide_empty: true
      show_thumbnail: true
      controls_hide: true
      thumbnail_alpha: 255
      thumbnail_padding: 0
      thumbnail_corner_radius: 18
      symmetric_corner_radius: true
      thumbnail_edge_fade: false
      callbacks:
        on_left: toggle_media_menu
        on_middle: toggle_play_pause

  media:
    type: yasb.media.MediaWidget
    options:
      label: '<table cellspacing="0" cellpadding="0"><tr><td align="left"><b>{title}</b></td></tr><tr><td align="left"><span style="color:#99968b; font-size:10px;">{artist}</span></td></tr></table>'
      label_alt: "{artist}"
      separator: " - "
      hide_empty: true
      class_name: "now-playing"
      max_field_size:
        label: 22
        label_alt: 28
        truncate_whole_label: false
      show_thumbnail: false
      controls_only: false
      controls_left: false
      controls_hide: true
      thumbnail_alpha: 100
      thumbnail_padding: 8
      thumbnail_corner_radius: 50
      symmetric_corner_radius: true
      thumbnail_edge_fade: false
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\ue768"
        pause: "\ue769"
      callbacks:
        on_left: "toggle_label"
        on_middle: "toggle_play_pause"
        on_right: "toggle_media_menu"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: "#ffc04d"
        alignment: center
        direction: down
        offset_top: 8
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 20
        max_source_size: 16
        show_source: true
        show_volume_slider: true
      scrolling_label:
        enabled: false
        update_interval_ms: 33
        style: left
        separator: "   •   "
        label_padding: 0
        always_scroll: false
      progress_bar:
        enabled: false

  audio_visualizer:
    type: yasb.audio_visualizer.AudioVisualizerWidget
    options:
      style: bars
      height: 16
      smoothness: 70
      sensitivity: 50
      auto_gain: true
      framerate: 30
      hide_idle: true
      hide_idle_after: 2000
      bars:
        count: 8
        width: 2
        gap: 2

  # Separate controls so the visualizer sits after the title and before buttons.
  media_controls:
    type: yasb.media.MediaWidget
    options:
      class_name: "playback-controls"
      hide_empty: true
      controls_only: true
      controls_hide: false
      show_thumbnail: false
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\ue768"
        pause: "\ue769"

  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>{icon}</span>{count}"
      label_alt: "<span>{icon}</span>{count}"
      hide_empty: false
      icons:
        new: "\ue7f4"
        default: "\ue7ed"
      callbacks:
        on_left: toggle_notification
